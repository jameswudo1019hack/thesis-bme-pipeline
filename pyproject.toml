[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thesis-pipeline"
version = "0.1.0"
description = "PSG processing pipeline for the SHHS thesis (James Wu, USyd BME Honours 2026)"
requires-python = ">=3.10"
dependencies = [
    "mne>=1.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "lxml>=4.9",
    "tqdm>=4.66",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "ipykernel>=6.29",
]

[tool.hatch.build.targets.wheel]
packages = ["thesis_pipeline"]
